name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type-check (strict)
        run: mypy src

      - name: Tests (offline; real sockets are blocked by the test suite)
        run: pytest -q --cov=weather_cli --cov-report=term-missing

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke-test the wheel in a clean virtual environment
        shell: bash
        run: |
          python -m venv "$PWD/wheel-env"
          BIN="$PWD/wheel-env/bin"; [ -d "$BIN" ] || BIN="$PWD/wheel-env/Scripts"
          "$BIN/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"  # away from src/ so only the installed wheel can be imported
          "$BIN/weather" --version
          "$BIN/weather" Yerevan --demo --forecast --hours 12
          "$BIN/weather" Yerevan --demo --plain --forecast
          "$BIN/weather" Yerevan --demo --output json | "$BIN/python" -c "import json,sys; assert json.load(sys.stdin)['mode'] == 'offline-synthetic-sample'"
          set +e; "$BIN/weather" London --demo; code=$?; set -e
          test "$code" -eq 3

      - name: First-run launcher (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./run.sh Yerevan --demo --plain
          ./run.sh Yerevan --demo --output json > /dev/null

      - name: First-run launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call run.bat Yerevan --demo --plain || exit /b 1
          powershell -ExecutionPolicy Bypass -File run.ps1 Yerevan --demo --plain || exit /b 1
