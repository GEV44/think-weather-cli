[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "think-weather-cli"
version = "1.0.0"
description = "Current weather, hourly and 5-day forecasts for a city or postal code, in your terminal"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gevorg Hovhannisyan" }]
keywords = ["weather", "cli", "open-meteo", "forecast", "terminal"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27,<1",
    "rich>=13.7,<16",
    "platformdirs>=4,<6",
    "tzdata>=2024.1; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]

[project.scripts]
weather = "weather_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weather_cli = ["demo/fixtures/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["weather_cli"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "C4"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # intentional Unicode glyphs (°, ·, block chars)
    "SIM905",  # a whitespace-split string is the most readable form for code tables
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S108"]
"scripts/**" = ["S101"]
"src/weather_cli/locations.py" = ["S101"]
"src/weather_cli/service.py" = ["S101"]
"src/weather_cli/interactive.py" = ["S101"]
"src/weather_cli/cli.py" = ["S101"]
"src/weather_cli/http.py" = ["S101", "S311"]  # jitter is not cryptography

[tool.ruff.lint.isort]
known-first-party = ["weather_cli", "conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["weather_cli"]
mypy_path = "src"
